<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Developer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        background-attachment: fixed;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }
      .profile-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      }
      .profile-card img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #fff;
        margin-bottom: 15px;
      }
      .social-icons a {
        color: white;
        font-size: 22px;
        margin: 0 8px;
        transition: 0.3s;
      }
      .social-icons a:hover {
        color: #ffdd57;
      }
      .skills span {
        background: #ffdd57;
        color: #333;
        padding: 5px 10px;
        border-radius: 5px;
        margin: 3px;
        display: inline-block;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="profile-card">
        <img src="../static/Yashi photo.jpg" alt="Developer Photo">
        <h2>Yashasvi Pandey</h2>
        <p class="mb-3">Aspiring Data Science | Full-Stack Developer | AI Enthusiast</p>

        <div class="skills mb-3">
          <span>Python</span>
          <span>JavaScript</span>
          <span>Bootstrap</span>
          <span>Machine Learning</span>
        </div>

        <div class="social-icons">
          <a href="#https://github.com/Yashasvi59"><i class="bi bi-github"></i></a>
          <a href="#https://www.linkedin.com/in/yashasvi-pandey590/"><i class="bi bi-linkedin"></i></a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  </body>
</html>
